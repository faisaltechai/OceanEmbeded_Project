<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OceanEmbed — Subsurface Ocean Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<meta name="description" content="OceanEmbed reconstructs subsurface ocean temperature from satellite surface observations using physics-informed AI, with uncertainty on every value.">
<meta name="theme-color" content="#020817">
<script src="assets/oceanembed-client.js"></script>
<style>
  /* ============================================================
     OceanEmbed design tokens
     Deep-navy abyss base, electric-blue instrument glow.
     Every dashboard class below is preserved from the original
     build — only the palette + surface treatment changed.
     ============================================================ */
  :root{
    /* base */
    --abyss:#020817;          /* page background */
    --trench:#040D1E;         /* deeper wells, map backdrop */
    --hull:#07172B;           /* solid panel fallback */
    --line:rgba(0,212,255,.14);
    --line-strong:rgba(0,212,255,.30);

    /* accents */
    --current:#00D4FF;        /* electric blue — primary */
    --cyan:#67E8F9;           /* highlight */
    --deep:#0B7FA8;           /* muted accent for bar tracks */
    --teal:#00D4FF;           /* legacy alias used by dashboard */
    --teal-dim:#0B4E68;       /* legacy alias */
    --blue:#00D4FF;           /* legacy alias */

    /* semantic */
    --sand:#FFC46B;
    --red:#FF6B7A;
    --green:#36E2A0;

    /* type */
    --text:#EAF4FB;
    --text-dim:#93AFC6;

    /* surfaces */
    --panel:rgba(10,26,46,.62);
    --panel-2:rgba(12,32,55,.85);
    --glass-edge:rgba(255,255,255,.07);

    /* glow */
    --glow-sm:0 0 20px rgba(0,212,255,.18);
    --glow-md:0 0 38px rgba(0,212,255,.26);
    --glow-lg:0 0 80px rgba(0,212,255,.30);

    --radius:14px;
    --radius-lg:20px;
    --ease:cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--abyss);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{overflow-x:hidden;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-feature-settings:'tnum' 1;}
  h1,h2,h3,.display{font-family:'Space Grotesk','Inter',system-ui,sans-serif;}
  a{color:var(--current);}
  img,canvas,svg{max-width:100%;}

  /* full-bleed app; dashboard content sits in .shell */
  #app{width:100%;}
  .shell{max-width:1200px;margin:0 auto;padding:0 20px 60px;}

  ::selection{background:rgba(0,212,255,.28);color:#fff;}
  :focus-visible{outline:2px solid var(--current);outline-offset:3px;border-radius:6px;}

  /* ============================================================
     Radar boot sequence
     ============================================================ */
  #boot{position:fixed;inset:0;z-index:999;background:var(--abyss);
    display:grid;place-items:center;transition:opacity .7s var(--ease),visibility .7s;}
  #boot.done{opacity:0;visibility:hidden;}
  .radar{width:180px;height:180px;position:relative;}
  .radar i{position:absolute;inset:0;border:1px solid rgba(0,212,255,.22);border-radius:50%;}
  .radar i:nth-child(2){inset:22%;}
  .radar i:nth-child(3){inset:44%;}
  .radar .sweep{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(0,212,255,0) 0deg,rgba(0,212,255,0) 270deg,rgba(0,212,255,.55) 360deg);
    -webkit-mask:radial-gradient(circle,#000 62%,transparent 63%);
    mask:radial-gradient(circle,#000 62%,transparent 63%);
    animation:sweep 1.6s linear infinite;}
  .radar .core{position:absolute;inset:0;display:grid;place-items:center;}
  .radar .core b{width:8px;height:8px;border-radius:50%;background:var(--current);box-shadow:var(--glow-md);}
  @keyframes sweep{to{transform:rotate(360deg);}}
  #boot .boot-label{position:absolute;left:0;right:0;bottom:calc(46% - 150px);text-align:center;
    font-size:11.5px;letter-spacing:.16em;color:var(--text-dim);}

  /* ============================================================
     Landing
     ============================================================ */
  .landing{position:relative;}
  .bleed{position:relative;width:100%;}
  .inner{max-width:1200px;margin:0 auto;padding:0 24px;}

  /* fixed brand bar */
  .brandbar{position:fixed;top:0;left:0;right:0;z-index:60;
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px max(24px,calc((100% - 1200px)/2));
    background:rgba(2,8,23,0);backdrop-filter:blur(0px);
    border-bottom:1px solid transparent;transition:background .35s var(--ease),border-color .35s var(--ease),backdrop-filter .35s;}
  .brandbar.stuck{background:rgba(2,8,23,.78);backdrop-filter:blur(14px) saturate(140%);border-bottom-color:var(--line);}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;
    font-weight:600;font-size:17px;letter-spacing:-.01em;color:var(--text);}
  .brand .mark{width:26px;height:26px;flex:none;}
  .brandbar nav.lnav{display:flex;gap:26px;background:none;border:none;position:static;padding:0;}
  .brandbar nav.lnav a{color:var(--text-dim);text-decoration:none;font-size:13.5px;transition:color .2s;}
  .brandbar nav.lnav a:hover{color:var(--text);}
  .brandbar .mini-cta{background:rgba(0,212,255,.10);border:1px solid var(--line-strong);color:var(--current);
    border-radius:9px;padding:8px 15px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;
    transition:background .25s,box-shadow .25s;}
  .brandbar .mini-cta:hover{background:rgba(0,212,255,.18);box-shadow:var(--glow-sm);}
  @media(max-width:860px){.brandbar nav.lnav{display:none;}}

  /* hero */
  .hero{position:relative;min-height:100svh;display:flex;align-items:center;
    padding:clamp(94px,11vh,118px) 0 clamp(44px,7vh,68px);
    overflow:hidden;border-bottom:1px solid var(--line);}
  .hero-grid{position:absolute;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(0,212,255,.055) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(0,212,255,.055) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask:radial-gradient(ellipse 80% 62% at 50% 42%,#000 10%,transparent 78%);
    mask:radial-gradient(ellipse 80% 62% at 50% 42%,#000 10%,transparent 78%);}
  .hero-wash{position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 55% at 72% 46%,rgba(0,140,200,.22),transparent 70%),
               radial-gradient(ellipse 50% 40% at 12% 78%,rgba(0,212,255,.10),transparent 72%);}
  #particles{position:absolute;inset:0;z-index:1;pointer-events:none;}
  #earth{position:absolute;top:50%;right:-6%;transform:translateY(-50%);
    width:min(940px,66vw);aspect-ratio:1;z-index:1;pointer-events:auto;}
  .hero-inner{position:relative;z-index:3;max-width:1200px;margin:0 auto;padding:0 24px;width:100%;}
  .hero-copy{max-width:660px;}

  .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.04em;
    color:var(--cyan);border:1px solid var(--line-strong);background:rgba(0,212,255,.07);
    border-radius:100px;padding:6px 14px;margin-bottom:26px;backdrop-filter:blur(8px);}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--current);
    box-shadow:0 0 10px var(--current);animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.72);}}

  .hero h1{font-size:clamp(38px,5.2vw,70px);line-height:1;letter-spacing:-.035em;
    font-weight:600;margin:0 0 18px;
    background:linear-gradient(168deg,#FFFFFF 12%,#BFE9FA 58%,#5EC6E8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero .lede{font-size:clamp(16px,1.35vw,18.5px);line-height:1.62;color:var(--text-dim);
    max-width:54ch;margin:0 0 30px;}
  .hero .lede b{color:var(--text);font-weight:500;}

  .cta-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}

  /* buttons — .cta kept as the primary class name from the original build */
  button.cta,.cta{position:relative;display:inline-flex;align-items:center;gap:10px;
    border:none;cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;
    padding:15px 26px;border-radius:12px;color:#001521;
    background:linear-gradient(135deg,#7EE9FF 0%,#00D4FF 46%,#0091C7 100%);
    box-shadow:0 10px 34px rgba(0,212,255,.30),inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .28s var(--ease),box-shadow .28s var(--ease),filter .28s;}
  button.cta:hover,.cta:hover{transform:translateY(-2px);filter:saturate(1.1);
    box-shadow:0 16px 46px rgba(0,212,255,.46),inset 0 1px 0 rgba(255,255,255,.55);}
  button.cta:active,.cta:active{transform:translateY(0);}
  .cta-ghost{display:inline-flex;align-items:center;gap:11px;cursor:pointer;font-family:inherit;
    font-size:15px;font-weight:500;padding:14px 22px;border-radius:12px;color:var(--text);
    background:rgba(255,255,255,.035);border:1px solid var(--line-strong);
    backdrop-filter:blur(10px);transition:background .25s,border-color .25s,transform .25s var(--ease);}
  .cta-ghost:hover{background:rgba(0,212,255,.10);border-color:rgba(0,212,255,.46);transform:translateY(-2px);}
  .cta-ghost .play{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:rgba(0,212,255,.16);border:1px solid var(--line-strong);}
  .cta-ghost .play svg{width:9px;height:9px;fill:var(--current);}

  /* hero stat strip */
  .statstrip{display:flex;flex-wrap:wrap;gap:0;margin-top:clamp(28px,4.4vh,46px);max-width:660px;
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    background:rgba(8,22,40,.42);backdrop-filter:blur(14px);}
  .statstrip .stat{flex:1 1 140px;padding:16px 18px;border-right:1px solid var(--line);}
  .statstrip .stat:last-child{border-right:none;}
  .statstrip .stat .v{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:500;
    color:var(--text);letter-spacing:-.02em;}
  .statstrip .stat .v em{font-style:normal;font-size:14px;color:var(--current);margin-left:2px;}
  .statstrip .stat .k{font-size:11.5px;color:var(--text-dim);margin-top:4px;line-height:1.4;}

  .scrollcue{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:3;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.14em;color:var(--text-dim);}
  .scrollcue .rail{width:1px;height:38px;background:linear-gradient(var(--current),transparent);
    animation:cue 2.2s ease-in-out infinite;transform-origin:top;}
  @keyframes cue{0%,100%{transform:scaleY(.4);opacity:.4;}50%{transform:scaleY(1);opacity:1;}}

  @media(max-width:980px){
    #earth{right:-24%;width:120vw;opacity:.34;}
    .hero{min-height:auto;padding:118px 0 64px;}
    .hero-copy{max-width:none;}
  }

  /* ============================================================
     Section scaffolding
     ============================================================ */
  .sec{position:relative;padding:104px 0;border-bottom:1px solid var(--line);}
  .sec-head{max-width:720px;margin-bottom:52px;}
  .sec-head .tag{font-size:12px;letter-spacing:.05em;color:var(--current);margin-bottom:14px;}
  .sec-head h2{font-size:clamp(28px,3.6vw,44px);line-height:1.08;letter-spacing:-.028em;
    font-weight:600;margin:0 0 16px;color:var(--text);}
  .sec-head p{font-size:16px;line-height:1.65;color:var(--text-dim);margin:0;max-width:62ch;}

  /* ============================================================
     Glassmorphism card system
     ============================================================ */
  .glass{position:relative;border-radius:var(--radius-lg);
    background:linear-gradient(158deg,rgba(18,40,66,.62),rgba(6,18,34,.52));
    border:1px solid var(--glass-edge);
    backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
    box-shadow:0 18px 50px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .4s var(--ease),border-color .4s,box-shadow .4s;}
  /* animated glowing border */
  .glass::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;
    background:linear-gradient(140deg,rgba(0,212,255,.42),rgba(0,212,255,0) 38%,rgba(0,212,255,0) 62%,rgba(103,232,249,.34));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:0;transition:opacity .4s var(--ease);pointer-events:none;}
  .glass:hover::before{opacity:1;}
  .glass.lift:hover{transform:translateY(-6px);
    box-shadow:0 30px 64px rgba(0,0,0,.52),0 0 44px rgba(0,212,255,.16),inset 0 1px 0 rgba(255,255,255,.09);}

  /* process pipeline */
  .pipe{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media(max-width:940px){.pipe{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:620px){.pipe{grid-template-columns:1fr;}}
  .step-card{padding:26px 24px 24px;display:flex;flex-direction:column;}
  .step-card .rowtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .step-card .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    background:rgba(0,212,255,.09);border:1px solid var(--line-strong);
    transition:background .35s,box-shadow .35s;}
  .step-card:hover .ico{background:rgba(0,212,255,.17);box-shadow:var(--glow-sm);}
  .step-card .ico svg{width:21px;height:21px;stroke:var(--current);fill:none;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .step-card .idx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);}
  .step-card h3{font-size:17.5px;font-weight:600;margin:0 0 9px;letter-spacing:-.012em;color:var(--text);}
  .step-card p{font-size:13.8px;line-height:1.6;color:var(--text-dim);margin:0;}
  .step-card .out{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--cyan);}

  /* ============================================================
     Dashboard preview
     ============================================================ */
  .dash{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;}
  @media(max-width:980px){.dash{grid-template-columns:1fr;}}
  .dash-pane{padding:20px;}
  .dash-pane .ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .dash-pane .ph h4{margin:0;font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.01em;}
  .dash-pane .ph .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);}
  .dash-stack{display:flex;flex-direction:column;gap:20px;}
  .heat{width:100%;height:auto;border-radius:12px;
    background:var(--trench);display:block;cursor:crosshair;}
  .heat rect{transition:opacity .12s;}
  .slider-row{display:flex;align-items:center;gap:14px;margin-top:16px;}
  .slider-row label{font-size:12px;color:var(--text-dim);white-space:nowrap;}
  .slider-row output{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--current);
    min-width:62px;text-align:right;}
  input[type=range]{flex:1;accent-color:var(--current);height:4px;}
  .scale{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:var(--text-dim);}
  .scale .bar{height:6px;flex:1;border-radius:3px;
    background:linear-gradient(90deg,#062B45,#0B6C93,#00D4FF,#FFC46B,#FF6B7A);}
  .readout{margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);
    min-height:17px;}
  .readout b{color:var(--cyan);font-weight:500;}

  /* cyclone risk gauge */
  .risk{display:flex;align-items:center;gap:18px;}
  .risk .dial{width:96px;height:96px;flex:none;position:relative;}
  .risk .dial svg{transform:rotate(-90deg);}
  .risk .dial .val{position:absolute;inset:0;display:grid;place-items:center;
    font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--text);}
  .risk .lbl .level{font-size:17px;font-weight:600;margin-bottom:5px;}
  .risk .lbl .why{font-size:12.5px;color:var(--text-dim);line-height:1.55;}
  .risk.elevated .lbl .level{color:var(--sand);}
  .risk.high .lbl .level{color:var(--red);}
  .risk.low .lbl .level{color:var(--green);}

  /* ============================================================
     Credibility
     ============================================================ */
  .creds{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  @media(max-width:1000px){.creds{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.creds{grid-template-columns:1fr;}}
  .cred{padding:24px 20px;}
  .cred .ico{width:38px;height:38px;margin-bottom:16px;border-radius:10px;display:grid;place-items:center;
    background:rgba(0,212,255,.08);border:1px solid var(--line);}
  .cred .ico svg{width:19px;height:19px;stroke:var(--cyan);fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;}
  .cred h4{margin:0 0 7px;font-size:14.5px;font-weight:600;color:var(--text);
    display:flex;align-items:flex-end;min-height:2.4em;line-height:1.2;}
  .cred p{margin:0;font-size:12.8px;line-height:1.58;color:var(--text-dim);}

  /* closing CTA */
  .close-cta{position:relative;text-align:center;padding:110px 0 116px;overflow:hidden;}
  .close-cta .halo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:900px;height:460px;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(0,212,255,.17),transparent 66%);}
  .close-cta h2{position:relative;font-size:clamp(30px,4.4vw,52px);line-height:1.05;
    letter-spacing:-.03em;font-weight:600;margin:0 0 18px;}
  .close-cta p{position:relative;color:var(--text-dim);font-size:17px;margin:0 auto 34px;max-width:52ch;line-height:1.6;}
  .close-cta .cta-row{position:relative;justify-content:center;}

  .land-foot{padding:34px 0;text-align:center;font-size:12.5px;color:var(--text-dim);
    border-top:1px solid var(--line);}

  /* ============================================================
     Demo modal
     ============================================================ */
  .modal{position:fixed;inset:0;z-index:200;display:none;place-items:center;padding:24px;
    background:rgba(2,8,23,.82);backdrop-filter:blur(10px);}
  .modal.open{display:grid;}
  .modal-box{width:min(760px,100%);padding:30px;border-radius:var(--radius-lg);
    background:linear-gradient(158deg,rgba(18,40,66,.92),rgba(6,18,34,.94));
    border:1px solid var(--line-strong);box-shadow:0 40px 110px rgba(0,0,0,.66),var(--glow-md);}
  .modal-box h3{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.02em;}
  .modal-box .sub{color:var(--text-dim);font-size:13.5px;margin-bottom:22px;}
  .chapters{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
  .chapter{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;
    padding:12px 14px;border-radius:11px;border:1px solid var(--line);
    background:rgba(0,212,255,.035);}
  .chapter .t{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--current);padding-top:2px;}
  .chapter .d strong{display:block;font-size:13.8px;font-weight:600;margin-bottom:3px;}
  .chapter .d span{font-size:12.5px;color:var(--text-dim);line-height:1.5;}
  .modal-actions{display:flex;gap:12px;flex-wrap:wrap;}
  .modal-close{position:absolute;top:18px;right:20px;background:none;border:none;color:var(--text-dim);
    font-size:26px;line-height:1;cursor:pointer;font-family:inherit;}

  /* ============================================================
     Scroll reveal
     ============================================================ */
  .reveal{opacity:0;transform:translateY(26px);
    transition:opacity .8s var(--ease),transform .8s var(--ease);}
  .reveal.in{opacity:1;transform:none;}

  /* ============================================================
     DASHBOARD  — original classes, restyled on the new tokens
     ============================================================ */
  nav{position:sticky;top:0;z-index:20;background:rgba(2,8,23,.86);
    backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line);
    display:flex;gap:2px;overflow-x:auto;padding:0 max(20px,calc((100% - 1200px)/2));
    scrollbar-width:thin;}
  nav button{background:none;border:none;color:var(--text-dim);padding:15px 14px;font-size:13.5px;
    cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-family:inherit;
    transition:color .22s,border-color .22s;}
  nav button.active{color:var(--text);border-bottom-color:var(--current);
    text-shadow:0 0 18px rgba(0,212,255,.45);}
  nav button:hover{color:var(--text);}

  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:24px 0 20px;}
  .demo-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,196,107,.10);color:var(--sand);
    border:1px solid rgba(255,196,107,.30);border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:500;}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select,button.ctl{background:rgba(12,32,55,.75);color:var(--text);border:1px solid var(--line-strong);
    border-radius:9px;padding:9px 13px;font-size:13px;font-family:inherit;cursor:pointer;
    transition:border-color .22s,box-shadow .22s,background .22s;}
  select:hover,button.ctl:hover{border-color:rgba(0,212,255,.5);box-shadow:var(--glow-sm);}
  select option{background:#07172B;color:var(--text);}

  .grid{display:grid;gap:18px;}
  .grid-2{grid-template-columns:2fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:820px){.grid-2,.grid-3{grid-template-columns:1fr;}}

  .card{position:relative;border-radius:var(--radius);padding:20px;
    background:linear-gradient(158deg,rgba(18,40,66,.55),rgba(6,18,34,.48));
    border:1px solid var(--glass-edge);
    backdrop-filter:blur(16px) saturate(145%);-webkit-backdrop-filter:blur(16px) saturate(145%);
    box-shadow:0 14px 38px rgba(0,0,0,.36),inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .35s var(--ease),border-color .35s,box-shadow .35s;}
  .card:hover{border-color:rgba(0,212,255,.26);
    box-shadow:0 22px 52px rgba(0,0,0,.46),0 0 32px rgba(0,212,255,.10),inset 0 1px 0 rgba(255,255,255,.08);}
  .card h3{margin:0 0 4px;font-size:13.5px;color:var(--text-dim);font-weight:500;
    font-family:'Inter',sans-serif;letter-spacing:.005em;}
  .card .big{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;margin:6px 0 2px;
    letter-spacing:-.025em;color:var(--text);}
  .card .sub{font-size:12px;color:var(--text-dim);}
  h2.section-title{font-size:22px;margin:0 0 16px;font-weight:600;letter-spacing:-.02em;}
  p.hint{color:var(--text-dim);font-size:13px;margin-top:8px;line-height:1.6;}

  #mapWrap{position:relative;}
  #mapSvg{width:100%;height:auto;border-radius:10px;background:var(--trench);cursor:crosshair;}
  .legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--text-dim);}
  .legend-bar{height:7px;flex:1;border-radius:4px;
    background:linear-gradient(90deg,#062B45,#0B6C93,#00D4FF,#FFC46B,#FF6B7A);}
  .depth-row{display:flex;align-items:center;gap:12px;margin-top:16px;}

  .list-item{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;
    background:rgba(11,28,49,.5);backdrop-filter:blur(10px);
    box-shadow:0 6px 18px rgba(0,0,0,.24);transition:border-color .28s,transform .28s var(--ease);}
  .list-item:hover{border-color:rgba(0,212,255,.3);transform:translateX(3px);}
  .list-item .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .badge{font-size:11px;padding:3px 9px;border-radius:100px;font-weight:600;}
  .badge.High{background:rgba(255,107,122,.14);color:var(--red);}
  .badge.Medium{background:rgba(255,196,107,.14);color:var(--sand);}
  .badge.Low{background:rgba(54,226,160,.14);color:var(--green);}
  .badge.AUV{background:rgba(255,107,122,.14);color:var(--red);}
  .badge.Glider{background:rgba(255,196,107,.14);color:var(--sand);}
  .badge.Argo{background:rgba(54,226,160,.14);color:var(--green);}
  .badge.BGC-Argo{background:rgba(0,212,255,.14);color:var(--current);}
  .reason{color:var(--text-dim);font-size:12.5px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
  th{color:var(--text-dim);font-weight:500;font-size:12px;}
  td.num{font-family:'IBM Plex Mono',monospace;}

  .barlist{display:flex;flex-direction:column;gap:11px;}
  .barrow{display:grid;grid-template-columns:80px 1fr 50px;align-items:center;gap:10px;font-size:12.5px;}
  .bartrack{background:rgba(0,212,255,.08);border-radius:4px;height:10px;overflow:hidden;}
  .barfill{height:100%;background:linear-gradient(90deg,var(--deep),var(--current));
    box-shadow:0 0 14px rgba(0,212,255,.42);}

  footer{color:var(--text-dim);font-size:12px;text-align:center;padding:32px 0;
    border-top:1px solid var(--line);margin-top:44px;}
  .about-flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--text-dim);font-size:13px;margin:16px 0;}
  .about-flow span.step{background:rgba(0,212,255,.07);border:1px solid var(--line);border-radius:8px;
    padding:7px 11px;color:var(--text);}
  code.inline{background:rgba(0,212,255,.09);padding:2px 7px;border-radius:5px;font-size:12.5px;
    font-family:'IBM Plex Mono',monospace;}

  /* legacy landing classes kept so nothing can break */
  .kicker{color:var(--current);font-size:13px;}
  .lede{color:var(--text-dim);}
  .pillrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px;}
  .pill{border:1px solid var(--line);color:var(--text-dim);border-radius:100px;padding:7px 15px;font-size:12.5px;}
  .flowstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .flowstep{padding:16px 14px;border-right:1px solid var(--line);font-size:13px;color:var(--text-dim);}
  .flowstep:last-child{border-right:none;}
  .flowstep b{display:block;color:var(--text);font-size:14px;margin-bottom:3px;}

  /* ============================================================
     Accessibility
     ============================================================ */
  @media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;}
    .reveal{opacity:1;transform:none;}
    .radar .sweep{animation:none;}
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;}

</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('oceanembed-data').textContent);
const REGION_KEYS = Object.keys(DATA.regions);

const state = {
  page: 'landing',
  region: REGION_KEYS[0],
  dateIdx: 0,
  depthKey: '0',
  selectedProfileIdx: 0,
  backendStatus: null,   // null=unchecked, 'ok'|'unreachable' once checked
  liveOverview: null,    // populated by loadLiveOverview()
};

function region(){ return DATA.regions[state.region]; }

function fmt(n, d=2){ return (n===null||n===undefined||Number.isNaN(n)) ? '—' : Number(n).toFixed(d); }

function colorForValue(v, lo, hi){
  const t = Math.max(0, Math.min(1, (v-lo)/(hi-lo || 1)));
  const stops = [[8,61,92],[10,79,115],[79,195,247],[232,216,168],[226,102,91]];
  const seg = t*(stops.length-1);
  const i = Math.min(stops.length-2, Math.floor(seg));
  const f = seg-i;
  const c = stops[i].map((c0,k)=>Math.round(c0+f*(stops[i+1][k]-c0)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

async function checkBackend(){
  const el = document.getElementById('backendBadge');
  if(!el) return;
  const res = await OceanEmbedAPI.health();
  if(!res.ok){
    state.backendStatus = 'unreachable';
    el.style.color = 'var(--red)'; el.style.background = 'rgba(226,102,91,.12)';
    el.textContent = '● backend unreachable — showing embedded demo data';
    return;
  }
  state.backendStatus = 'ok';
  const live = Object.entries(res.data.live_sources_configured||{}).filter(([,v])=>v).length;
  const total = Object.keys(res.data.live_sources_configured||{}).length;
  el.style.color = 'var(--green)'; el.style.background = 'rgba(91,201,138,.12)';
  el.textContent = `● backend online — cache: ${res.data.cache_backend} — ${live}/${total} live sources configured`;
}

async function onGenerateReport(){
  const btn = document.getElementById('reportBtn');
  const prevLabel = btn.textContent;
  btn.textContent = 'Generating…'; btn.disabled = true;
  const res = await OceanEmbedAPI.generateReport(state.region);
  btn.textContent = prevLabel; btn.disabled = false;
  if(!res.ok){
    alert(`Report generation needs the OceanEmbed backend running (${res.error}). Start it locally and try again.`);
    return;
  }
  window.open(`${(window.OCEANEMBED_API_BASE||'http://localhost:8000/api')}/report/download?path=${encodeURIComponent(res.data.file_path)}`, '_blank');
}

function renderNav(){
  let nav = document.querySelector('nav');
  if(!nav){ nav = document.createElement('nav'); document.getElementById('app').prepend(nav); }
  nav.innerHTML = PAGES.map(([k,label])=>`<button data-p="${k}" class="${state.page===k?'active':''}">${label}</button>`).join('');

function renderPage(){

/* Landing runtime handles, so we can tear the WebGL scene down cleanly
   whenever the SPA swaps #app.innerHTML for a dashboard page. */
const LANDING = { raf:null, renderer:null, scene:null, cleanup:[], observer:null };

function teardownLanding(){
  if(LANDING.raf){ cancelAnimationFrame(LANDING.raf); LANDING.raf = null; }
  LANDING.cleanup.forEach(fn=>{ try{ fn(); }catch(e){} });
  LANDING.cleanup = [];
  if(LANDING.observer){ LANDING.observer.disconnect(); LANDING.observer = null; }
  if(LANDING.scene){
    LANDING.scene.traverse(o=>{
      if(o.geometry) o.geometry.dispose();
      if(o.material){
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); });
      }
    });
    LANDING.scene = null;
  }
  if(LANDING.renderer){
    LANDING.renderer.dispose();
    if(LANDING.renderer.domElement && LANDING.renderer.domElement.parentNode){
      LANDING.renderer.domElement.parentNode.removeChild(LANDING.renderer.domElement);
    }
    LANDING.renderer = null;
  }
}

/* sticky bar shadow */
function initBrandbar(){
  const bar = document.getElementById('brandbar');
  if(!bar) return;
  const onScroll = ()=> bar.classList.toggle('stuck', window.scrollY > 24);
  onScroll();
  window.addEventListener('scroll', onScroll, {passive:true});
  LANDING.cleanup.push(()=>window.removeEventListener('scroll', onScroll));
}

/* scroll-triggered fade-up (GSAP ScrollTrigger if present, else IntersectionObserver) */
function initReveal(){
  const items = Array.from(document.querySelectorAll('.reveal'));
  if(!items.length) return;
  if(REDUCED_MOTION){ items.forEach(el=>el.classList.add('in')); return; }

  if(window.gsap && window.ScrollTrigger){
    gsap.registerPlugin(ScrollTrigger);
    items.forEach(el=>{
      ScrollTrigger.create({ trigger:el, start:'top 86%', once:true,
        onEnter:()=>el.classList.add('in') });
    });
    LANDING.cleanup.push(()=>ScrollTrigger.getAll().forEach(t=>t.kill()));
    return;
  }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.14, rootMargin:'0px 0px -8% 0px'});
  items.forEach(el=>io.observe(el));
  LANDING.observer = io;
}

/* animated counters */
function initCounters(){
  const els = Array.from(document.querySelectorAll('.count'));
  if(!els.length) return;
  const run = el=>{
    const to = parseFloat(el.dataset.to), dec = parseInt(el.dataset.dec,10) || 0;
    if(REDUCED_MOTION){ el.textContent = to.toFixed(dec); return; }
    const dur = 1400, t0 = performance.now();
    const tick = now=>{
      const p = Math.min(1,(now-t0)/dur);
      const eased = 1 - Math.pow(1-p, 3);          // easeOutCubic
      el.textContent = (to*eased).toFixed(dec);
      if(p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ run(e.target); io.unobserve(e.target); } });
  },{threshold:.5});
  els.forEach(el=>io.observe(el));
  LANDING.cleanup.push(()=>io.disconnect());
}

/* floating particle field (2D canvas — cheap, crisp, independent of WebGL) */
function initParticles(){
  const cv = document.getElementById('particles');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  let w=0, h=0, dpr=Math.min(window.devicePixelRatio||1, 2), motes=[], raf=null;

  const size = ()=>{
    const r = cv.getBoundingClientRect();
    w = r.width; h = r.height;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(90, (w*h)/16000));
    motes = Array.from({length:n},()=>({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.6+.4,
      vx:(Math.random()-.5)*.12, vy:-(Math.random()*.22+.05),
      a:Math.random()*.5+.15, ph:Math.random()*Math.PI*2,
    }));
  };
  const draw = ()=>{
    ctx.clearRect(0,0,w,h);
    for(const m of motes){
      m.x += m.vx; m.y += m.vy; m.ph += .018;
      if(m.y < -8){ m.y = h+8; m.x = Math.random()*w; }
      if(m.x < -8) m.x = w+8; if(m.x > w+8) m.x = -8;
      const a = m.a * (0.6 + 0.4*Math.sin(m.ph));
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(103,232,249,${a.toFixed(3)})`;
      ctx.fill();
    }
    raf = requestAnimationFrame(draw);
  };

  size();
  if(REDUCED_MOTION){ ctx.clearRect(0,0,w,h); motes.forEach(m=>{
      ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(103,232,249,${m.a.toFixed(3)})`; ctx.fill(); });
  } else { draw(); }

  const ro = new ResizeObserver(size); ro.observe(cv);
  LANDING.cleanup.push(()=>{ if(raf) cancelAnimationFrame(raf); ro.disconnect(); });
}

const toVec3 = (lon, lat, r) => {
  const phi = (90 - lat) * Math.PI/180, theta = (lon + 180) * Math.PI/180;
  return new THREE.Vector3(
    -r*Math.sin(phi)*Math.cos(theta),
     r*Math.cos(phi),
     r*Math.sin(phi)*Math.sin(theta)
  );
};

/* Paint the equirectangular globe texture on a 2D canvas. */
function buildEarthTexture(){
  const W = 2048, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  const X = lon => (lon + 180) / 360 * W;
  const Y = lat => (90 - lat) / 180 * H;

  /* ocean: latitude temperature banding, warm at the equator */
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0.00, '#020B18');
  grad.addColorStop(0.18, '#04203A');
  grad.addColorStop(0.36, '#06456B');
  grad.addColorStop(0.50, '#0A6E9B');
  grad.addColorStop(0.64, '#06456B');
  grad.addColorStop(0.82, '#04203A');
  grad.addColorStop(1.00, '#020B18');
  g.fillStyle = grad; g.fillRect(0,0,W,H);

  /* faint graticule — reads as an instrument, not a map */
  g.strokeStyle = 'rgba(0,212,255,.10)'; g.lineWidth = 1;
  for(let lat=-60; lat<=60; lat+=30){ g.beginPath(); g.moveTo(0,Y(lat)); g.lineTo(W,Y(lat)); g.stroke(); }
  for(let lon=-150; lon<=150; lon+=30){ g.beginPath(); g.moveTo(X(lon),0); g.lineTo(X(lon),H); g.stroke(); }

  /* landmasses */
  g.lineJoin = 'round';
  CONTINENTS.forEach(poly=>{
    g.beginPath();
    poly.forEach(([lon,lat],i)=>{ const x=X(lon), y=Y(lat); i ? g.lineTo(x,y) : g.moveTo(x,y); });
    g.closePath();
    g.fillStyle = '#0C1B2B';         // land sits darker than the sea: ocean is the subject
    g.fill();
    g.strokeStyle = 'rgba(103,232,249,.34)';   // glowing coastline
    g.lineWidth = 2.2;
    g.stroke();
  });

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  if('SRGBColorSpace' in THREE) tex.colorSpace = THREE.SRGBColorSpace;
  else if('sRGBEncoding' in THREE) tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function initEarth(attempt){
  const host = document.getElementById('earth');
  if(!host) return;

  if(typeof THREE === 'undefined'){ earthFallback(host); return; }

  let W = host.clientWidth, H = host.clientHeight;
  if(!W || !H){
    // aspect-ratio boxes can measure 0 before the first layout pass
    if((attempt||0) < 30) requestAnimationFrame(()=>initEarth((attempt||0)+1));
    else earthFallback(host);
    return;
  }

  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, W/H, 0.1, 100);
  camera.position.set(0, 0, 4.1);

  let renderer;
  try{
    renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
  }catch(err){ earthFallback(host); return; }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(W, H);
  if('outputColorSpace' in renderer && THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  else if('outputEncoding' in renderer && THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.domElement.style.cssText = 'width:100%;height:100%;display:block;';
  host.appendChild(renderer.domElement);

  LANDING.renderer = renderer;
  LANDING.scene = scene;

  const globe = new THREE.Group();
  globe.rotation.z = -23.4 * Math.PI/180;      // axial tilt
  scene.add(globe);

  /* --- sphere --- */
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(1, 72, 54),
    new THREE.MeshPhongMaterial({ map:buildEarthTexture(), shininess:12,
      specular:new THREE.Color(0x0B4C68) })
  );
  globe.add(sphere);

  /* --- atmosphere: fresnel rim in electric blue --- */
  const atmosphere = new THREE.Mesh(
    new THREE.SphereGeometry(1.17, 64, 48),
    new THREE.ShaderMaterial({
      transparent:true, side:THREE.BackSide, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{ uColor:{value:new THREE.Color(0x00D4FF)} },
      vertexShader:`
        varying vec3 vN; varying vec3 vP;
        void main(){
          vN = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position,1.0);
          vP = mv.xyz;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader:`
        uniform vec3 uColor; varying vec3 vN; varying vec3 vP;
        void main(){
          float rim = pow(clamp(dot(normalize(vN), normalize(vP)),0.0,1.0), 2.4);
          gl_FragColor = vec4(uColor, rim * 0.85);
        }`
    })
  );
  globe.add(atmosphere);

  /* --- ocean currents: static route + travelling particles --- */
  const flows = [];
  CURRENTS.forEach(({p})=>{
    const pts = p.map(([lon,lat])=>toVec3(lon, lat, 1.012));
    const curve = new THREE.CatmullRomCurve3(pts);

    const routeGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(180));
    globe.add(new THREE.Line(routeGeo, new THREE.LineBasicMaterial({
      color:0x00D4FF, transparent:true, opacity:.16 })));

    const N = 26;
    const pos = new Float32Array(N*3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color:0x7EE9FF, size:.026, transparent:true, opacity:.9,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true });
    const pointCloud = new THREE.Points(geo, mat);
    globe.add(pointCloud);

    flows.push({ curve, geo, N, offset:Math.random(), speed:.035 + Math.random()*.03 });
  });

  /* --- Bay of Bengal marker: the basin the demo opens on --- */
  const markerPos = toVec3(88, 15, 1.03);
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(.022, 16, 16),
    new THREE.MeshBasicMaterial({color:0x7EE9FF})
  );
  marker.position.copy(markerPos);
  globe.add(marker);

  const halo = new THREE.Mesh(
    new THREE.RingGeometry(.03, .045, 32),
    new THREE.MeshBasicMaterial({color:0x00D4FF, transparent:true, opacity:.7,
      side:THREE.DoubleSide, depthWrite:false})
  );
  halo.position.copy(markerPos);
  halo.lookAt(new THREE.Vector3(0,0,0));
  globe.add(halo);

  /* --- starfield --- */
  const starCount = 520, starPos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r = 12 + Math.random()*16;
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    starPos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    starPos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
    starPos[i*3+2] = r*Math.cos(ph);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
    color:0x9FD8EE, size:.055, transparent:true, opacity:.5, depthWrite:false })));

  /* --- lighting --- */
  scene.add(new THREE.AmbientLight(0x4A7A9B, 0.85));
  const key = new THREE.DirectionalLight(0xCFF2FF, 1.25);
  key.position.set(-2.4, 1.3, 2.6); scene.add(key);
  const rim = new THREE.DirectionalLight(0x00D4FF, 0.7);
  rim.position.set(2.6, -0.6, -1.8); scene.add(rim);

  /* --- pointer: parallax + drag --- */
  const target = {x:0, y:0};
  let spin = 0, dragging = false, lastX = 0, lastY = 0, manualY = 0, manualX = 0;

  const onMove = e=>{
    const r = host.getBoundingClientRect();
    target.x = ((e.clientX - r.left)/r.width  - .5) * 2;
    target.y = ((e.clientY - r.top )/r.height - .5) * 2;
  };
  const onDown = e=>{ dragging = true; lastX = e.clientX; lastY = e.clientY;
    host.style.cursor = 'grabbing'; host.setPointerCapture?.(e.pointerId); };
  const onDrag = e=>{
    if(!dragging) return;
    manualX += (e.clientX - lastX) * .006;
    manualY += (e.clientY - lastY) * .004;
    manualY = Math.max(-.8, Math.min(.8, manualY));
    lastX = e.clientX; lastY = e.clientY;
  };
  const onUp = ()=>{ dragging = false; host.style.cursor = 'grab'; };

  host.style.cursor = 'grab';
  host.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onDrag);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointermove', onMove, {passive:true});
  LANDING.cleanup.push(()=>{
    host.removeEventListener('pointerdown', onDown);
    window.removeEventListener('pointermove', onDrag);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointermove', onMove);
  });

  /* --- resize --- */
  const ro = new ResizeObserver(()=>{
    W = host.clientWidth; H = host.clientHeight;
    if(!W || !H) return;
    camera.aspect = W/H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
  ro.observe(host);
  LANDING.cleanup.push(()=>ro.disconnect());

  /* --- pause when the tab is hidden --- */
  let visible = !document.hidden;
  const onVis = ()=>{ visible = !document.hidden; };
  document.addEventListener('visibilitychange', onVis);
  LANDING.cleanup.push(()=>document.removeEventListener('visibilitychange', onVis));

  /* --- frame loop --- */
  const tmp = new THREE.Vector3();
  const loop = ()=>{
    LANDING.raf = requestAnimationFrame(loop);
    if(!visible) return;

    if(!REDUCED_MOTION && !dragging) spin += 0.0013;

    globe.rotation.y = spin + manualX;
    globe.rotation.x += ((target.y * .16 + manualY) - globe.rotation.x) * .045;

    /* advance current particles along their curves */
    if(!REDUCED_MOTION){
      for(const f of flows){
        f.offset = (f.offset + f.speed * 0.006) % 1;
        const arr = f.geo.attributes.position.array;
        for(let i=0;i<f.N;i++){
          const t = (f.offset + i/f.N) % 1;
          f.curve.getPoint(t, tmp);
          arr[i*3] = tmp.x; arr[i*3+1] = tmp.y; arr[i*3+2] = tmp.z;
        }
        f.geo.attributes.position.needsUpdate = true;
      }
      const t = performance.now() * .0018;
      const s = 1 + Math.sin(t)*.22;
      halo.scale.set(s, s, s);
      halo.material.opacity = .28 + (Math.sin(t)+1)*.22;
    }

    camera.position.x += (target.x * .22 - camera.position.x) * .04;
    camera.lookAt(0,0,0);
    renderer.render(scene, camera);
  };
  loop();
}

/* CSS-only glowing sphere if WebGL or the Three.js CDN is unavailable. */
function earthFallback(host){
  host.innerHTML = '';
  host.style.borderRadius = '50%';
  host.style.width = 'min(560px,46vw)';
  host.style.right = '4%';
  host.style.background =
    'radial-gradient(circle at 34% 30%, #0A6E9B 0%, #06456B 32%, #04203A 54%, #020B18 70%, transparent 72%)';
  host.style.boxShadow = '0 0 90px rgba(0,212,255,.16)';
  host.style.opacity = '.7';
  host.setAttribute('aria-hidden','true');
}

/* hero copy parallax */
function initParallax(){
  if(REDUCED_MOTION) return;
  const copy = document.querySelector('.hero-copy');
  const grid = document.getElementById('heroGrid');
  if(!copy) return;
  let tx=0, ty=0, cx=0, cy=0, raf=null;
  const onMove = e=>{
    tx = (e.clientX/window.innerWidth  - .5);
    ty = (e.clientY/window.innerHeight - .5);
    if(!raf) raf = requestAnimationFrame(step);
  };
  const step = ()=>{
    cx += (tx-cx)*.06; cy += (ty-cy)*.06;
    copy.style.transform = `translate3d(${(-cx*13).toFixed(2)}px,${(-cy*9).toFixed(2)}px,0)`;
    if(grid) grid.style.transform = `translate3d(${(cx*20).toFixed(2)}px,${(cy*14).toFixed(2)}px,0)`;
    raf = (Math.abs(tx-cx) > .001 || Math.abs(ty-cy) > .001) ? requestAnimationFrame(step) : null;
  };
  window.addEventListener('pointermove', onMove, {passive:true});
  LANDING.cleanup.push(()=>{ window.removeEventListener('pointermove', onMove);
    if(raf) cancelAnimationFrame(raf); });
}

/* ============================================================================
   PREVIEW DASHBOARD — reads the same arrays the full dashboard reads
   ========================================================================== */
function initPreview(){
  const holder = document.getElementById('pvHeat');
  if(!holder) return;

  const r = DATA.regions.bay_of_bengal || DATA.regions[REGION_KEYS[0]];
  const depthKeys = Object.keys(r.map_layers.temperature_by_depth)
                          .map(Number).sort((a,b)=>a-b).map(String);

  const slider = document.getElementById('pvDepth');
  slider.max = String(depthKeys.length - 1);

  const gridSVG = (grid, id, colorFn, cell=17)=>{
    const rows = grid.length, cols = grid[0].length;
    let out = '';
    for(let i=0;i<rows;i++){
      for(let j=0;j<cols;j++){
        const v = grid[i][j];
        out += `<rect x="${j*cell}" y="${(rows-1-i)*cell}" width="${cell}" height="${cell}"`
             + ` fill="${colorFn(v)}" data-i="${i}" data-j="${j}" data-v="${v}"/>`;
      }
    }
    return `<svg id="${id}" class="heat" viewBox="0 0 ${cols*cell} ${rows*cell}"`
         + ` preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
  };

  /* ---- temperature field ---- */
  const drawHeat = ()=>{
    const key = depthKeys[+slider.value];
    const grid = r.map_layers.temperature_by_depth[key];
    const flat = grid.flat();
    const lo = Math.min(...flat), hi = Math.max(...flat);

    holder.innerHTML = gridSVG(grid, 'pvHeatSvg', v=>colorForValue(v, lo, hi));
    document.getElementById('pvDepthOut').textContent = `${key} m`;
    document.getElementById('pvLo').textContent = `${fmt(lo,1)}°C`;
    document.getElementById('pvHi').textContent = `${fmt(hi,1)}°C`;

    const svg = document.getElementById('pvHeatSvg');
    const out = document.getElementById('pvReadout');
    svg.addEventListener('pointermove', e=>{
      const t = e.target;
      if(t.tagName !== 'rect') return;
      const i = +t.dataset.i, j = +t.dataset.j;
      out.innerHTML = `${fmt(r.lats[i],0)}°N ${fmt(r.lons[j],0)}°E `
                    + `· <b>${fmt(+t.dataset.v,2)} °C</b> at ${key} m`;
    });
    svg.addEventListener('pointerleave', ()=>{
      out.textContent = 'Hover the field to inspect a grid cell.';
    });
  };

  slider.addEventListener('input', drawHeat);
  drawHeat();

  /* ---- uncertainty field ---- */
  const unc  = r.map_layers.uncertainty_surface_mean;
  const uflat = unc.flat();
  const ulo = Math.min(...uflat), uhi = Math.max(...uflat);
  document.getElementById('pvUnc').innerHTML = gridSVG(unc, 'pvUncSvg', v=>{
    const t = Math.max(0, Math.min(1, (v-ulo)/(uhi-ulo || 1)));
    return `rgba(0,212,255,${(0.10 + t*0.80).toFixed(3)})`;
  }, 11);
  document.getElementById('pvUncNote').innerHTML =
    `range <b>±${fmt(ulo,2)}</b> to <b>±${fmt(uhi,2)} °C</b> — bright cells are where the model wants a float.`;

  /* ---- cyclone risk indicator ----
     Prototype composite over the bundle's own normalised event-risk field:
        50% basin mean  +  50% share of cells in the top risk band (>= 0.90).
     Deliberately NOT built from the event list: the demo detector only ever
     emits "High" severity, so an event-severity ratio would sit pegged at 100
     and tell a judge nothing. Same rule as the dashboard — nothing hand-typed. */
  const erGrid = r.active_learning?.grid?.components?.event_risk
              || r.active_learning?.components?.event_risk;
  const er = erGrid ? erGrid.flat() : [];
  const meanER = er.length ? er.reduce((a,b)=>a+b,0)/er.length : 0;
  const hotShare = er.length ? er.filter(v=>v >= 0.90).length/er.length : 0;
  const score = Math.round(100 * (0.5*meanER + 0.5*hotShare));

  const level = score >= 70 ? ['High','high'] : score >= 40 ? ['Elevated','elevated'] : ['Low','low'];
  const riskEl = document.getElementById('pvRisk');
  riskEl.classList.add(level[1]);
  riskEl.style.color = level[1] === 'high' ? 'var(--red)'
                     : level[1] === 'elevated' ? 'var(--sand)' : 'var(--green)';
  document.getElementById('pvRiskLevel').textContent = level[0];
  document.getElementById('pvRiskWhy').innerHTML =
    `<b>${fmt(hotShare*100,0)}%</b> of ${r.region_name} cells sit in the top event-risk band on `
  + `${r.map_layers.date_used}; basin mean <b>${fmt(meanER,2)}</b>.`;

  /* animate the dial + the number together */
  const arc = document.getElementById('pvRiskArc');
  const valEl = document.getElementById('pvRiskVal');
  const C = 264;
  const runDial = ()=>{
    if(REDUCED_MOTION){
      arc.style.strokeDashoffset = String(C - C*score/100);
      valEl.textContent = score; return;
    }
    const t0 = performance.now(), dur = 1500;
    const tick = now=>{
      const p = Math.min(1,(now-t0)/dur), e = 1 - Math.pow(1-p,3);
      arc.style.strokeDashoffset = String(C - C*(score/100)*e);
      valEl.textContent = Math.round(score*e);
      if(p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const dialIO = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ runDial(); dialIO.unobserve(e.target); } });
  },{threshold:.5});
  dialIO.observe(riskEl);
  LANDING.cleanup.push(()=>dialIO.disconnect());

  /* ---- digital ocean profile ---- */
  drawPreviewProfile(r);
}

function drawPreviewProfile(r){
  const host = document.getElementById('pvProfile');
  if(!host) return;
  const p = r.profile_samples[0];
  const depths = DATA.depths_m;
  const pred = p.predicted_temperature_c, unc = p.uncertainty_c, argo = p.argo_observed_c;
  const meanSigma = unc.reduce((a,b)=>a+b,0)/unc.length;

  const W = 900, H = 300, m = {t:14, r:16, b:34, l:44};
  const tMin = Math.min(...pred.map((v,i)=>v-unc[i])) - .6;
  const tMax = Math.max(...pred.map((v,i)=>v+unc[i])) + .6;
  const dMax = Math.max(...depths);

  const X = t => m.l + (t - tMin)/(tMax - tMin) * (W - m.l - m.r);
  const Y = d => m.t + d/dMax * (H - m.t - m.b);

  const band = pred.map((v,i)=>`${X(v+unc[i])},${Y(depths[i])}`).join(' ')
             + ' ' + pred.map((v,i)=>`${X(v-unc[i])},${Y(depths[i])}`).reverse().join(' ');
  const line = pred.map((v,i)=>`${i?'L':'M'}${X(v)},${Y(depths[i])}`).join('');
  const dots = argo ? argo.map((v,i)=>
    `<circle cx="${X(v)}" cy="${Y(depths[i])}" r="3.2" fill="none"
             stroke="#FFC46B" stroke-width="1.6"/>`).join('') : '';

  const xTicks = [];
  for(let t=Math.ceil(tMin/5)*5; t<=tMax; t+=5){
    xTicks.push(`<line x1="${X(t)}" y1="${m.t}" x2="${X(t)}" y2="${H-m.b}"
        stroke="rgba(0,212,255,.10)"/>
      <text x="${X(t)}" y="${H-m.b+18}" fill="#93AFC6" font-size="11"
        text-anchor="middle" font-family="IBM Plex Mono, monospace">${t}°</text>`);
  }
  const yTicks = [0,200,400,600,800,1000].map(d=>
    `<line x1="${m.l}" y1="${Y(d)}" x2="${W-m.r}" y2="${Y(d)}" stroke="rgba(0,212,255,.08)"/>
     <text x="${m.l-8}" y="${Y(d)+4}" fill="#93AFC6" font-size="11" text-anchor="end"
       font-family="IBM Plex Mono, monospace">${d}</text>`).join('');

  host.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="height:auto;display:block" role="img"
         aria-label="Temperature versus depth with uncertainty band and ARGO observations"
         xmlns="http://www.w3.org/2000/svg">
      ${yTicks}${xTicks.join('')}
      <polygon points="${band}" fill="rgba(0,212,255,.14)"/>
      <path d="${line}" fill="none" stroke="#00D4FF" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"
            style="filter:drop-shadow(0 0 7px rgba(0,212,255,.6))"/>
      ${dots}
      <text x="${W-m.r}" y="${H-6}" fill="#93AFC6" font-size="11" text-anchor="end">
        temperature (°C) → · depth (m) ↓
      </text>
    </svg>
    <div class="readout" style="display:flex;gap:20px;flex-wrap:wrap;">
      <span><b style="color:#00D4FF">&mdash;</b> reconstruction</span>
      <span><b style="color:#00D4FF">&#9646;</b> &plusmn;1&sigma; band &mdash; mean &plusmn;${fmt(meanSigma,2)} &deg;C,
        thinner than the stroke at this scale</span>
      <span><b style="color:#FFC46B">&#9675;</b> ARGO observed</span>
    </div>`;

  document.getElementById('pvProfMeta').textContent =
    `${fmt(p.lat,0)}°N ${fmt(p.lon,0)}°E · thermocline ${fmt(p.thermocline.thermocline_depth_m,0)} m`;
}

/* ------------------------------------------------------------- demo modal -- */
function initDemoModal(go){
  const modal = document.getElementById('demoModal');
  const open  = document.getElementById('demoBtn');
  if(!modal || !open) return;

  let lastFocus = null;
  const show = ()=>{ lastFocus = document.activeElement; modal.classList.add('open');
    document.getElementById('demoStart').focus(); };
  const hide = ()=>{ modal.classList.remove('open'); lastFocus?.focus(); };

  open.onclick = show;
  document.getElementById('demoClose').onclick = hide;
  document.getElementById('demoDismiss').onclick = hide;
  document.getElementById('demoStart').onclick = ()=>{ hide(); go('map'); };
  modal.addEventListener('click', e=>{ if(e.target === modal) hide(); });

  const onKey = e=>{ if(e.key === 'Escape' && modal.classList.contains('open')) hide(); };
  document.addEventListener('keydown', onKey);
  LANDING.cleanup.push(()=>document.removeEventListener('keydown', onKey));
}

/* --------------------------------------------------------- boot sequence --- */
function dismissBoot(){
  const boot = document.getElementById('boot');
  if(!boot) return;
  const done = ()=> boot.classList.add('done');
  if(REDUCED_MOTION){ done(); return; }
  setTimeout(done, 900);
}

let mapDepthOptions = [];
function afterMap(){
  const r = region();
  mapDepthOptions = ['0', ...Object.keys(r.map_layers.temperature_by_depth)];
  drawMap();
  document.getElementById('depthSlider').oninput = (e)=>{
    state.depthKey = mapDepthOptions[+e.target.value];
    document.getElementById('depthLabel').textContent = state.depthKey + ' m';
    drawMap();
  };
}

function drawMap(){
  const r = region();
  const grid = state.depthKey==='0' ? r.map_layers.sst : r.map_layers.temperature_by_depth[state.depthKey];
  const flat = grid.flat();
  const lo = Math.min(...flat), hi = Math.max(...flat);
  const nRows = grid.length, nCols = grid[0].length;
  const cell = 22;
  const w = nCols*cell, h = nRows*cell;
  let rects = '';
  for(let i=0;i<nRows;i++){
    for(let j=0;j<nCols;j++){
      const v = grid[i][j];
      rects += `<rect data-i="${i}" data-j="${j}" x="${j*cell}" y="${(nRows-1-i)*cell}" width="${cell-1}" height="${cell-1}"
        fill="${colorForValue(v,lo,hi)}"><title>${fmt(v,1)}°C</title></rect>`;
    }
  }
  const svg = `<svg id="mapSvg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${rects}</svg>`;
  document.getElementById('mapSvgHolder').innerHTML = svg;
  document.getElementById('mapSvg').querySelectorAll('rect').forEach(rect=>{
    rect.style.cursor='pointer';
    rect.onclick = ()=>{
      const i = +rect.dataset.i, j = +rect.dataset.j;
      const lat = r.lats[i], lon = r.lons[j];
      document.getElementById('clickInfo').innerHTML = `lat ${fmt(lat,2)}, lon ${fmt(lon,2)}<br>value ${fmt(grid[i][j],1)}°C at ${state.depthKey}m`;
      // jump to nearest precomputed profile sample
      let bestIdx=0, bestD=Infinity;
      r.profile_samples.forEach((s,idx)=>{ const d=(s.lat-lat)**2+(s.lon-lon)**2; if(d<bestD){bestD=d; bestIdx=idx;} });
      state.selectedProfileIdx = bestIdx;
      state.page='profile'; render();
    };
  });
}

let profileChartRef = null;
function afterProfile(){
  document.getElementById('profSel').onchange = e=>{ state.selectedProfileIdx = +e.target.value; renderPage(); };
  drawProfile();
}
function drawProfile(){
  const r = region();
  const s = r.profile_samples[state.selectedProfileIdx];
  const depths = DATA.depths_m;
  const pred = s.predicted_temperature_c, unc = s.uncertainty_c;
  const upper = pred.map((v,i)=>v+unc[i]), lower = pred.map((v,i)=>v-unc[i]);

  const ctx = document.getElementById('profileChart').getContext('2d');
  if(profileChartRef) profileChartRef.destroy();
  const datasets = [
    {label:'Uncertainty +1σ', data:upper, borderColor:'rgba(79,195,247,0.0)', backgroundColor:'rgba(79,195,247,0.16)', fill:'+1', pointRadius:0, tension:.3},
    {label:'Uncertainty -1σ', data:lower, borderColor:'rgba(79,195,247,0.0)', backgroundColor:'rgba(79,195,247,0.16)', fill:false, pointRadius:0, tension:.3},
    {label:'OceanEmbed prediction', data:pred, borderColor:'#4FC3F7', backgroundColor:'#4FC3F7', pointRadius:2, tension:.3, borderWidth:2},
    {label:'GLORYS reference', data:s.glorys_reference_c, borderColor:'#E8D8A8', borderDash:[6,4], pointRadius:0, tension:.3, borderWidth:1.5},
  ];
  if(s.argo_observed_c){
    datasets.push({label:`Synthetic ARGO (${s.argo_observed_date})`, data:s.argo_observed_c, borderColor:'#FFFFFF',
      backgroundColor:'#FFFFFF', showLine:false, pointRadius:4, pointStyle:'rectRot'});
  }
  profileChartRef = new Chart(ctx, {
    type:'line',
    data:{ labels: depths, datasets },
    options:{
      indexAxis:'y',
      scales:{
        y:{reverse:true, title:{display:true,text:'Depth (m)',color:'#D6E8F2'}, ticks:{color:'#D6E8F2'}, grid:{color:'#1A5E7A'}},
        x:{title:{display:true,text:'Temperature (°C)',color:'#D6E8F2'}, ticks:{color:'#D6E8F2'}, grid:{color:'#1A5E7A'}},
      },
      plugins:{legend:{labels:{color:'#FFFFFF', filter:(item)=> !item.text.startsWith('Uncertainty')}}},
      maintainAspectRatio:false,
    }
  });

  document.getElementById('thermoBox').innerHTML = `
    depth &nbsp; ${fmt(s.thermocline.thermocline_depth_m,0)} m<br>
    temp &nbsp;&nbsp; ${fmt(s.thermocline.thermocline_temperature_c,2)}°C<br>
    gradient ${fmt(s.thermocline.max_gradient_c_per_m,3)} °C/m`;
  document.getElementById('ohcBox').innerHTML = s.ocean_heat_content.heat_content_j_per_m2
    ? `${(s.ocean_heat_content.heat_content_j_per_m2/1e9).toFixed(2)} GJ/m²`
    : '—';
  document.getElementById('confList').innerHTML = depths.map((d,i)=>{
    const c = s.confidence[i];
    return `<div style="display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line);">
      <span class="mono">${d}m</span><span class="badge ${c==='High'?'Low':(c==='Low'?'High':'Medium')}">${c}</span></div>`;
  }).join('');
}

let selectedSamplingIdx = null;
function afterSampling(){
  const r = region();
  if(!r.active_learning) return;
  selectedSamplingIdx = null;
  drawSamplingMap();
  document.querySelectorAll('.samplingRow').forEach(row=>{
    row.onclick = ()=>{
      selectedSamplingIdx = +row.dataset.idx;
      showSamplingDetail(selectedSamplingIdx);
      document.getElementById('viewProfileBtn').style.display = 'inline-block';
    };
  });
  document.getElementById('viewProfileBtn').onclick = ()=>{
    if(selectedSamplingIdx===null) return;
    const rec = region().active_learning.recommendations[selectedSamplingIdx];
    jumpToNearestProfile(rec.latitude, rec.longitude);
    state.page = 'profile'; render();
  };
}

function showSamplingDetail(idx){
  const rec = region().active_learning.recommendations[idx];
  document.getElementById('samplingDetail').innerHTML = `
    <b>Rank ${rec.rank} · lat ${fmt(rec.latitude,2)}, lon ${fmt(rec.longitude,2)}</b><br>
    ${rec.reason}<br>
    recommended depths: ${rec.recommended_depths_m.map(d=>fmt(d,0)).join(', ')} m<br>
    re-sampling: every ${rec.adaptive_sampling.recommended_sampling_interval_days} day(s)
    — ${rec.adaptive_sampling.reason}`;
}

function jumpToNearestProfile(lat, lon){
  const r = region();
  let bestIdx = 0, bestD = Infinity;
  r.profile_samples.forEach((s,idx)=>{ const d=(s.lat-lat)**2+(s.lon-lon)**2; if(d<bestD){ bestD=d; bestIdx=idx; } });
  state.selectedProfileIdx = bestIdx;
}

function drawSamplingMap(){
  const r = region();
  const al = r.active_learning;
  const grid = al.grid.acquisition_score;
  const lats = al.grid.lats, lons = al.grid.lons;
  const flat = grid.flat();
  const lo = Math.min(...flat), hi = Math.max(...flat);
  const nRows = grid.length, nCols = grid[0].length;
  const cell = 22;
  const w = nCols*cell, h = nRows*cell;
  let rects = '';
  for(let i=0;i<nRows;i++){
    for(let j=0;j<nCols;j++){
      const v = grid[i][j];
      rects += `<rect data-i="${i}" data-j="${j}" x="${j*cell}" y="${(nRows-1-i)*cell}" width="${cell-1}" height="${cell-1}"
        fill="${colorForValue(v,lo,hi)}"><title>acquisition ${fmt(v,2)} at lat ${fmt(lats[i],1)}, lon ${fmt(lons[j],1)}</title></rect>`;
    }
  }
  let markers = '';
  al.recommendations.slice(0,8).forEach(rec=>{
    const i = lats.findIndex(x=>Math.abs(x-rec.latitude)<1e-6);
    const j = lons.findIndex(x=>Math.abs(x-rec.longitude)<1e-6);
    if(i<0||j<0) return;
    const cx = j*cell + cell/2, cy = (nRows-1-i)*cell + cell/2;
    markers += `<circle cx="${cx}" cy="${cy}" r="${cell*0.34}" fill="rgba(2,27,45,.55)" stroke="#FFFFFF" stroke-width="1.4"/>
      <text x="${cx}" y="${cy+3}" font-size="9" text-anchor="middle" fill="#FFFFFF" font-family="IBM Plex Mono, monospace">${rec.rank}</text>`;
  });
  const svg = `<svg id="samplingMapSvg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${rects}${markers}</svg>`;
  document.getElementById('samplingMapHolder').innerHTML = svg;
  document.getElementById('samplingMapSvg').querySelectorAll('rect').forEach(rect=>{
    rect.style.cursor = 'pointer';
    rect.onclick = ()=>{
      const i = +rect.dataset.i, j = +rect.dataset.j;
      jumpToNearestProfile(lats[i], lons[j]);
      state.page = 'profile'; render();
    };
  });
}

/* ---------------- CYCLONES (live NOAA NHC feed) ---------------- */
function pageCyclones(){
  return `
  <h2 class="section-title">Cyclone Mode — Live Active Storms</h2>
  <p class="hint">Live feed: NOAA National Hurricane Center (Atlantic / East Pacific coverage). Requires the OceanEmbed backend to be running.</p>
  <div id="cycloneList"><div class="list-item">Loading live cyclone feed…</div></div>
  `;
}
async function afterCyclones(){
  const el = document.getElementById('cycloneList');
  const res = await OceanEmbedAPI.cyclones();
  if(!res.ok){
    el.innerHTML = `<div class="list-item">${OceanEmbedAPI.statusBadgeHTML('error')} Backend unreachable (${res.error}). Start the OceanEmbed backend to see live storm tracks.</div>`;
    return;
  }
  const storms = (res.data.data && res.data.data.storms) || [];
  if(storms.length === 0){
    el.innerHTML = `<div class="list-item">${OceanEmbedAPI.statusBadgeHTML(res.data.status)} No active storms reported right now by ${res.data.source}.</div>`;
    return;
  }
  el.innerHTML = storms.map(s => `
    <div class="list-item">
      <div class="row1"><b>${s.name || 'Unnamed system'} — ${s.classification||''}</b>${OceanEmbedAPI.statusBadgeHTML(res.data.status)}</div>
      <div class="reason">lat ${fmt(s.lat,2)}, lon ${fmt(s.lon,2)} · ${s.intensity_kt||'—'} kt · ${s.pressure_mb||'—'} mb · moving ${s.movement||'—'}</div>
    </div>`).join('');
}

    <div class="card"><h3>Correlation</h3><div class="big">${fmt(r.metrics.model.correlation,3)}</div><div class="sub">baseline ${fmt(r.metrics.baseline_climatology.correlation,3)}</div></div>
  </div>
  <div class="grid grid-2" style="margin-top:16px;">
    <div class="card"><h3>RMSE vs depth — model vs. climatology baseline</h3><canvas id="rmseChart" height="260"></canvas></div>
    <div class="card">
      <h3>Independent ARGO comparison</h3>
      ${r.argo_validation ? `
      <table><tr><td>n profiles</td><td class="num">${r.argo_validation.n_argo_profiles}</td></tr>
      <tr><td>RMSE</td><td class="num">${fmt(r.argo_validation.rmse,2)}°C</td></tr>

let rmseChartRef=null;
function afterValidation(){
  const r = region();
  const ctx = document.getElementById('rmseChart').getContext('2d');
  if(rmseChartRef) rmseChartRef.destroy();
  rmseChartRef = new Chart(ctx, {
    type:'line',
    data:{ labels: r.depthwise_model.map(d=>d.depth_m),
      datasets:[
        {label:'OceanEmbed', data:r.depthwise_model.map(d=>d.rmse), borderColor:'#4FC3F7', backgroundColor:'#4FC3F7', tension:.3},
        {label:'Climatology baseline', data:r.depthwise_baseline.map(d=>d.rmse), borderColor:'#E8D8A8', backgroundColor:'#E8D8A8', tension:.3, borderDash:[6,4]},
      ]},
    options:{ scales:{ x:{title:{display:true,text:'Depth (m)',color:'#D6E8F2'},ticks:{color:'#D6E8F2'},grid:{color:'#1A5E7A'}},
      y:{title:{display:true,text:'RMSE (°C)',color:'#D6E8F2'},ticks:{color:'#D6E8F2'},grid:{color:'#1A5E7A'}}},
      plugins:{legend:{labels:{color:'#FFFFFF'}}}, maintainAspectRatio:false }
  });
}

/* ---------------- EXPLAINABLE AI ---------------- */
function pageXai(){
  const r = region();
  return `
  <h2 class="section-title">Explainable AI — ${r.region_name}</h2>
  <p class="hint">Method: feature ablation — each surface variable replaced by its dataset mean; importance = mean absolute shift in the predicted profile, normalized to sum to 1.</p>
  <div class="card"><div class="barlist" id="xaiBars"></div></div>
  `;
}
function afterXai(){
  const r = region();
  const entries = Object.entries(r.explainability).sort((a,b)=>b[1]-a[1]);
  const max = Math.max(...entries.map(e=>e[1]));
  document.getElementById('xaiBars').innerHTML = entries.map(([k,v])=>`
    <div class="barrow">
      <span class="mono" style="color:var(--text-dim);">${k}</span>
      <div class="bartrack"><div class="barfill" style="width:${(v/max*100).toFixed(1)}%"></div></div>
      <span class="mono">${(v*100).toFixed(1)}%</span>
    </div>`).join('');
}
